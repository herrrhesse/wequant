# Exchange trading rules of the A-share market by board (or exchange) and effective date.
#
# A row applies from `since` until the next row of the same table and board (or exchange).
# Fractions are exact decimals, prices are 厘 (0.001 元) and quantities are shares.
# `confirm` says what still needs a primary source.

# Daily price bands around the preclose: normal, and st for ST and *ST stocks (st defaults to normal).

[[band]]
id = "band-main-1996"
board = "main"
since = 1996-12-16
normal = 0.10
st = 0.05

[[band]]
id = "band-main-2026"
board = "main"
since = 2026-07-06
normal = 0.10
st = 0.10
confirm = "date measured in BaoStock data (first ST bars outside 5% on SH and SZ, none before); an SSE consultation of 2026-04 proposed the change; the effective notice was not read"

[[band]]
id = "band-chinext-2009"
board = "chinext"
since = 2009-10-30
normal = 0.10

[[band]]
id = "band-chinext-2020"
board = "chinext"
since = 2020-08-24
normal = 0.20
st = 0.20

[[band]]
id = "band-star-2019"
board = "star"
since = 2019-07-22
normal = 0.20
st = 0.20

[[band]]
id = "band-bse-2020"
board = "bse"
since = 2020-07-27
normal = 0.30
st = 0.30
confirm = "NEEQ select-tier start; the BSE opened 2021-11-15 with the same band"

# New listings, chosen by listing date. Day 1 is the listing day; free_days counts the first days without a limit.
# first_day_up and first_day_down set the day-1 band around the issue price, only with free_days 0.

[[new_listing]]
