# Transfer fee on both sides. basis: amount (turnover) or par (shares × 1 元, the par value assumed for every stock).

[[transfer_fee]]
id = "transfer-sh-par-1990"
exchanges = ["SH"]
since = 1990-12-19
rate = 0.0005
basis = "par"
confirm = "0.5‰ of par is the rate a secondary source (36kr) gives for before 2012-06-01; earlier history, the widely quoted 1‰, the 1 元 minimum and par values other than 1 元 (e.g. 601899.SH 0.1, 603993.SH 0.2) are not modelled"

[[transfer_fee]]
