[project]
name = "wequant"
version = "0.1.0"
description = "WeQuant 微框: local A-share stock selection and backtesting"
readme = "README.md"
authors = [
    { name = "hhesse-bot", email = "herrrhesse@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.0",
]

[project.optional-dependencies]
baostock = ["baostock>=0.9.4"]  # the release probed in S2.2 (reports itself as 00.9.40); has query_daily_history_k_AStock

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = ["."]
addopts = "-m 'not network'"
markers = ["network: talks to a live data source; run with -m network"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # the formatter wraps code; long report strings stay whole
