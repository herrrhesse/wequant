# Synthetic examples of every rule in wequant/rules/rules.toml except the lot rules (tests/test_rules_lots_fees.py),
# with expected values worked out by hand from the rule's rates. No real market data (D20): prices are made up.
#
# Prices and fees are 厘 (0.001 元). A missing key is null. [[limit]] rows give the price_limits inputs (board, date,
# preclose, is_st, list_date, listing_day) and the expected limit_up, limit_down, limit_rule and limit_state.
# [[fee]] rows give one fill and the expected stamp tax and transfer fee with the rules in force.

[[limit]]
case = "L1"
board = "main"
date = 2023-04-17
list_date = 2023-04-10
listing_day = 6
preclose = 12350
limit_up = 13590
limit_down = 11120
limit_rule = "band-main-1996"
limit_state = "LIMITED"
why = "day 6 after five free listing days takes the normal band; 12350 x 1.1 = 13585 and x 0.9 = 11115 are ties that round up"

[[limit]]
case = "L2"
