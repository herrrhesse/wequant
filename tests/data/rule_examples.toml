# Historical examples of every rule in wequant/rules/rules.toml, with golden values.
#
# Prices are 厘 (0.001 元). A missing key is null. [[limit]] rows give the price_limits inputs (code, date, board,
# preclose, is_st, list_date, listing_day), the expected limit_up, limit_down, limit_rule and limit_state, and the
# day's observed high and low. Observed values come from store v3 (the investment_data seed, 2026-11-08 release).

[[limit]]
code = "600053.SH"
date = 2024-02-20
board = "main"
preclose = 13550
limit_up = 14910
limit_down = 12200
limit_rule = "band-main-1996"
limit_state = "LIMITED"
high = 14910
low = 13310
source = "store v3 bars; tie: 13.55 × 1.1 = 14.905 rounds up to 14.91, × 0.9 = 12.195 to 12.20"

